[package]
name = "agent-bookkeeper"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A revision-aware archive controller for raw agent-session evidence"

[dependencies]
blake3 = "1.8"
libc = "0.2"
rusqlite = { version = "0.38", features = ["backup", "bundled"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.20", features = ["v4"] }

[dev-dependencies]
tempfile = "3.23"
